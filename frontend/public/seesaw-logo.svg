<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#8a58ee"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Ground -->
  <line x1="48" y1="70" x2="72" y2="70" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Pivot triangle -->
  <polygon points="52,68 68,68 60,54" fill="#8a58ee" opacity="0.9"/>
  <!-- Beam (tilted -10deg) -->
  <rect x="10" y="41" width="100" height="8" rx="4" fill="url(#beamGrad)" opacity="0.95"
        transform="rotate(-10, 60, 45)"/>
  <!-- Left weight (positive) -->
  <circle cx="16" cy="34" r="12" fill="#10b981" opacity="0.9"/>
  <text x="16" y="39" text-anchor="middle" font-size="14">👍</text>
  <!-- Right weight (negative) -->
  <circle cx="104" cy="56" r="12" fill="#ef4444" opacity="0.9"/>
  <text x="104" y="61" text-anchor="middle" font-size="14">👎</text>
</svg>
